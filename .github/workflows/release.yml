name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git checkout "$TAG"

      - name: Build app
        run: make

      - name: Package DMG
        run: |
          APP="ClipSpot"
          rm -rf dmg-staging && mkdir dmg-staging
          cp -R "Build/$APP.app" "dmg-staging/$APP.app"
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "$APP" -srcfolder dmg-staging -ov -format UDZO -fs HFS+ "$APP.dmg"
          shasum -a 256 "$APP.dmg" > "$APP.dmg.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: |
            ClipSpot.dmg
            ClipSpot.dmg.sha256
          body: |
            Built by GitHub Actions from `${{ steps.meta.outputs.tag }}` — see the
            [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            for the exact source + commands.

            Verify the checksum:
            ```sh
            shasum -a 256 ClipSpot.dmg
            ```
