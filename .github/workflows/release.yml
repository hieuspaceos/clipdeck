name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git checkout "$TAG"

      - name: Build app
        run: make

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm cert.p12

      - name: Sign app bundle
        env:
          SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" \
            "Build/ClipSpot.app"
          codesign --verify --deep --strict --verbose=2 "Build/ClipSpot.app"

      - name: Package DMG
        run: |
          APP="ClipSpot"
          rm -rf dmg-staging && mkdir dmg-staging
          cp -R "Build/$APP.app" "dmg-staging/$APP.app"
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "$APP" -srcfolder dmg-staging -ov -format UDZO -fs HFS+ "$APP.dmg"

      - name: Notarize and staple
        env:
          SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          APP="ClipSpot"
          echo "$ASC_KEY_BASE64" | base64 --decode > AuthKey.p8
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$APP.dmg"
          xcrun notarytool submit "$APP.dmg" \
            --key AuthKey.p8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait
          rm AuthKey.p8
          xcrun stapler staple "$APP.dmg"
          xcrun stapler validate "$APP.dmg"
          spctl -a -vvv -t open --context context:primary-signature "$APP.dmg"
          shasum -a 256 "$APP.dmg" > "$APP.dmg.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: |
            ClipSpot.dmg
            ClipSpot.dmg.sha256
          body: |
            Built by GitHub Actions from `${{ steps.meta.outputs.tag }}` — see the
            [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            for the exact source + commands.

            Verify the checksum:
            ```sh
            shasum -a 256 ClipSpot.dmg
            ```
